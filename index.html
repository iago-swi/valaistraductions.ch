<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valais Traductions</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<!-- Fallback only: on the server, .htaccess already redirects by browser language. -->
<script>
  var lang = (navigator.language || 'en').toLowerCase().slice(0, 2);
  location.replace((lang === 'fr' || lang === 'de' ? lang : 'en') + '/index.html');
</script>
<noscript><meta http-equiv="refresh" content="0; url=en/index.html"></noscript>
</head>
<body>
<p><a href="fr/index.html">Français</a> · <a href="en/index.html">English</a> · <a href="de/index.html">Deutsch</a></p>
</body>
</html>
